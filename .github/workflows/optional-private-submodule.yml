name: Optional private submodule

on:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "private/ao-cloud"
      - "test/submodule/**"
      - ".github/workflows/optional-private-submodule.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "private/ao-cloud"
      - "test/submodule/**"
      - ".github/workflows/optional-private-submodule.yml"

permissions:
  contents: read

jobs:
  unauthenticated-recursive-clone:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ao-ci, ci-heavy]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Verify recursive clone skips private repository
        run: ./test/submodule/optional-private-checkout.sh
