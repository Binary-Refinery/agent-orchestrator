name: Instructor configuration recovery

on:
  pull_request:
    paths:
      - "scripts/remove-optional-ide-mcp.py"
      - "scripts/test_remove_optional_ide_mcp.py"
      - ".github/workflows/instructor-recovery.yml"
  push:
    branches: [main]
    paths:
      - "scripts/remove-optional-ide-mcp.py"
      - "scripts/test_remove_optional_ide_mcp.py"
      - ".github/workflows/instructor-recovery.yml"

permissions:
  contents: read

jobs:
  configuration-recovery:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: configuration-recovery (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner_labels: [self-hosted, linux, x64, ao-ci, ci-heavy]
          - os: windows-latest
            runner_labels: [self-hosted, windows, x64, ao-ci]
    runs-on: ${{ matrix.runner_labels }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test optional IDE configuration removal
        run: python -m unittest discover -s scripts -p test_remove_optional_ide_mcp.py -v
